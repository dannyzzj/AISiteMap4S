<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:1600px;height:900px;overflow:hidden;background:#07131f}#map{width:1600px;height:900px;border:0;display:block}</style></head><body><iframe id="map" src="/"></iframe><script>const f=document.getElementById('map');f.addEventListener('load',()=>{const d=f.contentDocument;if(!d)return;['.topbar','.metric-row','.toolbar','.info-panel','.hover-card','.loading','.env-status','.compass'].forEach(s=>d.querySelectorAll(s).forEach(el=>el.style.display='none'));});</script></body></html>
